<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 36px;
      background: #1f2937;
      border-radius: 12px;
    }
    h1 {
      font-size: 64px;
      margin: 0 0 10px;
      color: #60a5fa;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      background: #60a5fa;
      color: #111827;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Ceci n'est pas une page</p>
    <p>Looks like this route took a wrong turn.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
